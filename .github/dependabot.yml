version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: 'weekly'
    # Wait 5 days before updating to help circumvent supply chain attacks
    cooldown:
      default-days: 5
      # Exclude plugin-e2e to prevent false positives with canary e2e tests
      exclude:
        - '@grafana/plugin-e2e'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      # @grafana/data, /runtime, /ui and /schema are pinned together at the
      # reference host version (11.4.x). Bumping one across a major breaks peer
      # resolution outright - npm ci fails with ERESOLVE, as it did in #24 -
      # and would raise the effective Grafana floor above the declared
      # grafanaDependency ">=11.0.0". A major move has to be deliberate and
      # cover all four at once, so Dependabot should not propose it piecemeal.
      #
      # Minor is ignored for the same reason, learned from #39: these packages
      # are webpack externals, so the installed version never ships - it only
      # decides what `tsc` accepts. Pinned at the reference host version, a
      # green typecheck means "compiles against the Grafana we target"; off it,
      # tsc silently starts accepting APIs that are undefined on the hosts
      # grafanaDependency promises. Nothing else in CI catches that: the
      # levitate compatibilitycheck runs against *latest* Grafana, so it finds
      # removed APIs and never not-yet-existing ones. #39 also showed a minor
      # can move backwards - 11.6.16 pins dompurify 3.2.4 exactly, downgrading
      # it from the 3.4.13 that 11.4.0's "^3.0.0" range resolves.
      #
      # Patch still flows through the `grafana` group below, which is where the
      # upstream fixes actually are - 11.4.x runs to 11.4.8.
      - dependency-name: '@grafana/*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

      # eslint majors are held at 9.x because eslint-plugin-react has no release
      # that supports eslint 10. Its latest (7.37.5) declares
      # peer eslint "^3 || ^4 || ^5 || ^6 || ^7 || ^8 || ^9.7", and it is not
      # optional here - @grafana/eslint-config requires it as a peer. Taking
      # eslint 10 fails `npm ci` outright with ERESOLVE, which is why #38 is red.
      #
      # Forcing the peer with an npm `overrides` entry is not a way out: it
      # installs, then the lint run dies on the first file with
      #   TypeError: Error while loading rule 'react/display-name':
      #   contextOrFilename.getFilename is not a function
      # because eslint 10 removed the legacy context.getFilename() that the
      # plugin's React-version detection calls. The peer range is accurate
      # rather than merely conservative, so the block is real and upstream.
      #
      # Every other member of the eslint group already declares eslint ^10, so
      # only the eslint major is ignored - the rest keep flowing through the
      # group. Revisit when eslint-plugin-react ships eslint 10 support.
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
    groups:
      unit-test:
        patterns:
          - '@testing-library/*'
          - 'jest*'
          - '@types/jest'
      eslint:
        patterns:
          - '@grafana/eslint-config'
          - 'eslint*'
          - '@typescript-eslint/*'
          - '@stylistic/*'
      grafana:
        patterns:
          - '@grafana/*'
        dependency-type: 'production'
        # Patch only - minor and major are ignored above so the four stay on
        # the reference host's 11.4.x line.
        update-types:
          - 'patch'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
    open-pull-requests-limit: 5

  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    allow:
      - dependency-name: 'github.com/grafana/grafana-plugin-sdk-go'
        dependency-type: 'all'
    commit-message:
      prefix: 'chore'
      include: 'scope'
