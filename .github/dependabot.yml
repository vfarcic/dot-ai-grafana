version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: 'weekly'
    # Wait 5 days before updating to help circumvent supply chain attacks
    cooldown:
      default-days: 5
      # Exclude plugin-e2e to prevent false positives with canary e2e tests
      exclude:
        - '@grafana/plugin-e2e'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      # @grafana/data, /runtime, /ui and /schema are pinned together at the
      # reference host version (11.4.x). Bumping one across a major breaks peer
      # resolution outright - npm ci fails with ERESOLVE, as it did in #24 -
      # and would raise the effective Grafana floor above the declared
      # grafanaDependency ">=11.0.0". A major move has to be deliberate and
      # cover all four at once, so Dependabot should not propose it piecemeal.
      # Minor and patch still flow through the `grafana` group below.
      - dependency-name: '@grafana/*'
        update-types:
          - 'version-update:semver-major'
    groups:
      unit-test:
        patterns:
          - '@testing-library/*'
          - 'jest*'
          - '@types/jest'
      eslint:
        patterns:
          - '@grafana/eslint-config'
          - 'eslint*'
          - '@typescript-eslint/*'
          - '@stylistic/*'
      grafana:
        patterns:
          - '@grafana/*'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
    open-pull-requests-limit: 5

  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    allow:
      - dependency-name: 'github.com/grafana/grafana-plugin-sdk-go'
        dependency-type: 'all'
    commit-message:
      prefix: 'chore'
      include: 'scope'
