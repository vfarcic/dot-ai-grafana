name: Doc gates

# Four mechanical checks that a docs/config PR would otherwise need a human to
# re-derive by hand. See scripts/doc-gates/README.md.
#
# Deliberately separate from ci.yml: it needs no npm install, no Go toolchain and
# no Docker, so it reports in seconds instead of waiting behind the build.

on:
  pull_request:
    branches:
      - master
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc-gates:
    name: Doc gates (A-D)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gate A diffs against the PR base

      - name: Run gates A-D
        run: python3 scripts/doc-gates/run.py --base "origin/${GITHUB_BASE_REF}" --verbose
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

  links:
    name: External links (warn only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never blocks a merge: a third party's outage is not this PR's defect.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links in docs/ and README.md
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,301,302,403,429
            README.md 'docs/**/*.md'
          fail: false
