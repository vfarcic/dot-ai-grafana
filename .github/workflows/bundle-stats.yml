name: Bundle Stats

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Deliberately no `pull-requests: write`. GitHub issues a read-only GITHUB_TOKEN
# to `pull_request` runs whose head is a fork, whatever is declared here, so a PR
# comment can never work for outside contributors - and every contributor PR in
# this repo comes from a fork. The comparison is written to the job summary
# instead, which needs no write scope, so fork and non-fork PRs take the exact
# same path and this job goes red only when the bundle cannot be built or
# measured.
permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # On main, the upstream action builds stats.json and uploads it as the
      # main-branch-stats artifact that the PR steps below compare against. It
      # never comments on this path, so it keeps working untouched.
      - name: Build and publish main branch stats
        if: github.event_name != 'pull_request'
        uses: grafana/plugin-actions/bundle-size@bundle-size/v1.1.1

      - name: Setup Node.js environment
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: npm ci

      - name: Build frontend with bundle stats
        if: github.event_name == 'pull_request'
        run: npm run build -- --profile --json pr-stats.json

      # Reading artifacts needs only `actions: read`, which fork runs do get.
      # head_branch is pinned to main so the baseline cannot come from anywhere
      # else. Today the upstream action already refuses to upload off main, but
      # that guard lives in a third-party action we pin by tag - asserting it
      # here keeps the invariant local and survives a bump.
      - name: Find the latest main branch stats
        if: github.event_name == 'pull_request'
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: main-branch-stats
        run: |
          API_ERR=0
          RUN_ID=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT}&per_page=100" \
            --jq "[.artifacts[] | select(.name == \"${ARTIFACT}\" and .expired == false and .workflow_run.head_branch == \"main\")] | sort_by(.created_at) | last | .workflow_run.id // empty" 2>&1) || API_ERR=$?
          # run-id must be digits only so a gh warning on stdout cannot become the baseline.
          # lookup-error is a heredoc so newlines in gh stderr cannot break GITHUB_OUTPUT.
          if [ "$API_ERR" -ne 0 ]; then
            echo "run-id=" >> "$GITHUB_OUTPUT"
            {
              echo "lookup-error<<ERR"
              printf '%s\n' "$RUN_ID"
              echo "ERR"
            } >> "$GITHUB_OUTPUT"
          else
            RUN_ID=$(printf '%s' "$RUN_ID" | tr -d '\r' | tr -d '\n')
            if [ -n "$RUN_ID" ] && ! printf '%s' "$RUN_ID" | grep -Eq '^[0-9]+$'; then
              echo "run-id=" >> "$GITHUB_OUTPUT"
              {
                echo "lookup-error<<ERR"
                printf '%s\n' "baseline run-id is not numeric: ${RUN_ID}"
                echo "ERR"
              } >> "$GITHUB_OUTPUT"
            else
              echo "run-id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "lookup-error=" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Download the latest main branch stats
        if: github.event_name == 'pull_request' && steps.baseline.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: main-branch-stats
          github-token: ${{ github.token }}
          run-id: ${{ steps.baseline.outputs.run-id }}

      - name: Report bundle size against main
        if: github.event_name == 'pull_request' && steps.baseline.outputs.run-id != ''
        run: node .github/scripts/bundle-size-summary.mjs stats.json pr-stats.json

      - name: Warn if main stats artifact could not be found
        if: github.event_name == 'pull_request' && steps.baseline.outputs.run-id == '' && steps.baseline.outputs.lookup-error == ''
        run: |
          echo "::warning title=Main stats artifact could not be found::No baseline artifact found on main. Push a commit to main, or run this workflow manually with workflow_dispatch, to generate the baseline."

      - name: Warn if main stats artifact lookup failed
        if: github.event_name == 'pull_request' && steps.baseline.outputs.lookup-error != ''
        env:
          LOOKUP_ERROR: ${{ steps.baseline.outputs.lookup-error }}
        run: |
          echo "::warning title=Main stats artifact lookup failed::GitHub API lookup failed: ${LOOKUP_ERROR}"
